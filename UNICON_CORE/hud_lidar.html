<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UNICON LiDAR HUD</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #000;
      color: #0f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      display: grid;
      place-items: center;
    }
    .box { text-align: center; }
    .mm { font-size: 96px; line-height: 1; letter-spacing: 2px; }
    .meta { margin-top: 12px; font-size: 18px; opacity: 0.85; }
    .err { color: #f00; font-size: 18px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="mm" id="mm">--</div>
    <div class="meta" id="meta">strength: -- | temp: -- | age: -- ms</div>
    <div class="err" id="err"></div>
  </div>

  <script>
    const API = "/api/lidar";   // działa, bo serwujemy z tego samego hosta
    const mmEl = document.getElementById("mm");
    const metaEl = document.getElementById("meta");
    const errEl = document.getElementById("err");

    async function tick() {
      const t0 = performance.now();
      try {
        const r = await fetch(API, { cache: "no-store" });
        const j = await r.json();
        if (!r.ok) throw new Error(j?.error || "HTTP " + r.status);

        const ageMs = Math.max(0, Math.round((Date.now()/1000 - (j.timestamp || Date.now()/1000)) * 1000));
        mmEl.textContent = `${j.distance_mm} mm`;
        metaEl.textContent = `strength: ${j.strength} | temp: ${j.temperature_c}°C | age: ${ageMs} ms`;
        errEl.textContent = "";
      } catch (e) {
        errEl.textContent = "ERROR: " + (e?.message || e);
      } finally {
        const dt = performance.now() - t0;
        // ~10 Hz, kompensacja czasu requestu
        setTimeout(tick, Math.max(50, 100 - dt));
      }
    }
    tick();
  </script>
</body>
</html>
