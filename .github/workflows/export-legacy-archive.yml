name: Export legacy archive

on:
  push:
    paths:
      - .github/workflows/export-legacy-archive.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build complete legacy archive
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY#*/}"
          out="${RUNNER_TEMP}/legacy-archive"
          mkdir -p "${out}"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' --prune
          git bundle create "${out}/${repo}.bundle" --all
          tar --exclude=.git -czf "${out}/${repo}-main-snapshot.tar.gz" .
          git show-ref > "${out}/REFS.txt"
          git log --all --date=iso-strict --pretty=format:'%H%x09%ad%x09%an%x09%s' > "${out}/COMMITS.tsv"
          printf 'Repository: %s\nArchived by NOSMO on 2026-08-13\n' "${GITHUB_REPOSITORY}" > "${out}/README.txt"
          sha256sum "${out}"/* > "${out}/SHA256SUMS.txt"
      - name: Upload complete legacy archive
        uses: actions/upload-artifact@v4
        with:
          name: legacy-archive-${{ github.event.repository.name }}
          path: ${{ runner.temp }}/legacy-archive/
          if-no-files-found: error
          retention-days: 1
